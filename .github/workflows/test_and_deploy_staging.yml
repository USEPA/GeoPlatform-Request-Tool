name: "test and deploy staging"

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test:
    runs-on: ubuntu-latest
    name: unit test frontend and backend
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and tag backend image
        id: build-image-backend
        uses: docker/build-push-action@v4
        with:
          file: Dockerfile.api
          context: .
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Run backend unit tests
        run: |
          docker run ${{ steps.build-image-backend.outputs.imageid }} python manage.py test

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: install frontend deps and run tests
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd ./ui
          npm ci
          npm run test:ci
      - name: build frontend
        run: |
          cd ./ui
          npm run build:ngst-staging
      - name: save build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./ui/dist/ui


  deploy:
    runs-on: staging
    name: deploy to staging
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: copy app
        run: |
          If (Test-Path ..\..\..\..\app_backup) {Remove-Item -Recurse -Force ..\..\..\..\app_backup}
          Copy-Item -Path ..\..\..\..\app\ -Destination ..\..\..\..\app_backup\
          Copy-Item ..\..\..\..\app\web.config .\web.config
          Copy-Item ..\..\..\..\app\.env .\.env
          Remove-Item -Path ..\..\..\..\app\* -Force -Recurse
          Copy-Item -Path .\* -Destination ..\..\..\..\app\ -Recurse -Exclude ("ui", ".git", ".github") -Force
      - name: install reqs, run migrations and collectstatic
        working-directory: ..\..\..\..\
        run: |
          $env:Path = "$PWD\venv;$env:Path"
          cd .\app
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py collectstatic --noinput
      - name: download ui
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ..\..\..\..\ui\

  e2e_test:
    runs-on: staging
    name: e2e testing
    needs: deploy
    environment: staging
    env:
      CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: create cypress env file from secret
        env:
          TESTING_CREDS: ${{ secrets.TESTING_CREDS }}
        run: |
          Set-Content -Path ".\ui\cypress.env.json" -Value $env:TESTING_CREDS -NoNewline

      - name: install frontend deps
        working-directory: ./ui
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          $env:PATH = "${{ vars.NODE_PATH }};$env:PATH"
          npm ci

      - name: add recaptcha testing settings
        run: |
          $settingsFile = "AGOLAccountRequestor/settings.py"
          $backupFile = "AGOLAccountRequestor/settings.py.backup"
          Copy-Item -Path $settingsFile -Destination $backupFile
          Add-Content -Path $settingsFile -Value "`n`n# Temporary recaptcha testing settings`nDRF_RECAPTCHA_TESTING = True`nDRF_RECAPTCHA_TESTING_PASS = True"

      - name: run e2e tests
        working-directory: ./ui
        run: |
          $env:PATH = "${{ vars.NODE_PATH }};$env:PATH"
          npm run cypress:run

      - name: restore original settings
        if: always()
        run: |
          $settingsFile = "AGOLAccountRequestor/settings.py"
          $backupFile = "AGOLAccountRequestor/settings.py.backup"
          Copy-Item -Path $backupFile -Destination $settingsFile -Force
          Remove-Item -Path $backupFile

      - name: upload cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: ./ui/cypress/videos/

