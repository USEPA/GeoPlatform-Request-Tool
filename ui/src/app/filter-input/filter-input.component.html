<mat-form-field>
  <mat-label>{{  label }}</mat-label>
  <mat-select [(ngModel)]="filtered" (ngModelChange)="filteredChange.emit(filtered)">
    @if (type === 'boolean') {
      <mat-option [value]="true">
        True
      </mat-option>
      <mat-option [value]="false">
        False
      </mat-option>
    }
    @if (type === 'choices') {
      @for (choice of choices; track choice) {
        <mat-option [value]="choice[value_field ? value_field : field_name]">
          {{ choice[field_name] }}
        </mat-option>
      }
    }
  </mat-select>
  @if (filtered !== undefined) {
    <button matSuffix mat-button type="button" color="accent"
      (click)="clearFilter($event)">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
